# Disposable M4 measurement profile. Original upstream application is immutable.
services:
  baseline:
    cpus: 1.0
    mem_limit: 1g
  origin:
    cpus: 2.0
    mem_limit: 1g
    entrypoint: [/dispatcharrpy/bin/python, /m4-perf/origin.py]
    volumes:
      - ../scripts/rust-m4-perf:/m4-perf:ro
  source:
    image: ghcr.io/dispatcharr/dispatcharr@sha256:34f9011514edd31ef0ff111b5f256d2e37614fcb08a6ee1ed9eccec9251a856f
    platform: linux/amd64
    working_dir: /app
    entrypoint: [/dispatcharrpy/bin/python, /m4-perf/source_web.py]
    cpus: 2.0
    mem_limit: 512m
    environment:
      DJANGO_SECRET_KEY: playback-fixture-only
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: playback-fixture-only
      POSTGRES_HOST: baseline
      POSTGRES_PORT: "5432"
      REDIS_HOST: baseline
      REDIS_PORT: "6379"
      REDIS_PASSWORD: playback-fixture-only
      DJANGO_SETTINGS_MODULE: dispatcharr.settings
      DISPATCHARR_ENV: aio
      DISPATCHARR_LOG_LEVEL: WARNING
      PYTHONDONTWRITEBYTECODE: "1"
      DISPATCHARR_TRUSTED_PROXIES: none
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ${BASELINE_SOURCE_DIR:?isolated original archive}:/app:ro
      - ../scripts/rust-playback-baseline:/verification:ro
      - ../scripts/rust-m4-perf:/m4-perf:ro
    tmpfs:
      - /data:mode=1777,size=67108864
      - /app/media:mode=1777,size=67108864
      - /tmp:mode=1777,size=134217728
    ports: ["127.0.0.1::5656", "127.0.0.1::9191"]
    depends_on: [baseline]
    stop_grace_period: 15s
  candidate:
    cpus: 2.0
    mem_limit: 512m
