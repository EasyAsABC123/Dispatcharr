[uwsgi]
chdir = /app
module = dispatcharr.wsgi:application
virtualenv = /dispatcharrpy
master = true
workers = 1
lazy-apps = true
http = 0.0.0.0:5656
http-keepalive = 1
buffer-size = 65536
post-buffering = 4096
http-timeout = 600
socket-timeout = 600
gevent = 400
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch
thunder-lock = true
die-on-term = true
vacuum = true
disable-logging = true
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings
