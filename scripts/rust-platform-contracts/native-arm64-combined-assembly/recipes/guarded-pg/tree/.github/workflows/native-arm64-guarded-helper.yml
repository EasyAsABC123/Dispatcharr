name: Native ARM64 guarded PostgreSQL helper qualification

"on":
  push:
    branches: [validation/m10-arm64-helper-2581d75b-2]
    paths:
      - '.github/workflows/native-arm64-guarded-helper.yml'
      - 'scripts/rust-platform-contracts/guarded-arm64-helper/**'

permissions:
  contents: read

concurrency:
  group: guarded-pg-helper-arm64-2581
  cancel-in-progress: false

jobs:
  guarded-pg-helper:
    if: github.repository == 'EasyAsABC123/Dispatcharr' && github.ref == 'refs/heads/validation/m10-arm64-helper-2581d75b-2' && !github.event.deleted
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Check out the exact validation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            .github/workflows
            scripts/rust-platform-contracts/guarded-arm64-helper
            rust/runtime/taskless-guard
      - name: Build and run the pinned helper on native ARM64
        shell: bash
        run: bash scripts/rust-platform-contracts/guarded-arm64-helper/qualify.sh
