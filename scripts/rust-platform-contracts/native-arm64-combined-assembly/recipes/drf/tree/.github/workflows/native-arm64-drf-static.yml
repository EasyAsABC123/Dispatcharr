name: Native ARM64 DRF static assets

"on":
  push:
    branches: [validation/m10-arm64-drf-static-dd9c2450-1]
    paths:
      - '.github/workflows/native-arm64-drf-static.yml'
      - 'scripts/rust-platform-contracts/native-arm64-drf-static/**'

permissions:
  contents: read

concurrency:
  group: m10-arm64-drf-static-dd9c2450
  cancel-in-progress: false

jobs:
  media:
    if: github.repository == 'EasyAsABC123/Dispatcharr' && github.ref == 'refs/heads/validation/m10-arm64-drf-static-dd9c2450-1' && !github.event.deleted
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out exact validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/native-arm64-drf-static.yml
            /scripts/rust-platform-contracts/native-arm64-drf-static/
      - name: Compare the unmodified DRF static export on the native donor
        shell: bash
        run: bash scripts/rust-platform-contracts/native-arm64-drf-static/qualify.sh
      - name: Retain text-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-arm64-drf-static-evidence
          path: ${{ runner.temp }}/native-arm64-drf-static-evidence/
          if-no-files-found: error
          retention-days: 14
