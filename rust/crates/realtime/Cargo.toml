[package]
name = "dispatcharr-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dispatcharr-contracts = {path="../contracts"}
dispatcharr-store = {path="../store"}
dispatcharr-output-store = {path="../output-store"}
axum = {version="0.8",features=["ws"]}
bytes = "1"
futures-util = "0.3"
hyper = {version="1",features=["http1"]}
hyper-util = {version="0.1",features=["tokio"]}
rand = "0.8"
redis = {version="0.32",features=["tokio-comp"]}
serde_json = "1"
tokio = {version="1",features=["rt-multi-thread","net","sync","time","macros","io-util"]}
tokio-tungstenite = {version="0.29",default-features=false,features=["handshake"]}
tracing = "0.1"
url = "2"
uuid = {version="1",features=["v4"]}

[dev-dependencies]
tower = {version="0.5",features=["util"]}
sqlx = {version="0.8",default-features=false,features=["runtime-tokio-rustls","postgres"]}
