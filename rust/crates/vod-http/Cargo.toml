[package]
name = "dispatcharr-vod-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
bytes = "1"
dispatcharr-clients = { path = "../clients" }
dispatcharr-contracts = { path = "../contracts" }
dispatcharr-ingest-core = { path = "../ingest-core" }
dispatcharr-coordination = { path = "../coordination" }
dispatcharr-output-store = { path = "../output-store" }
dispatcharr-store = { path = "../store" }
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
redis = { version = "0.32", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
