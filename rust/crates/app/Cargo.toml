[package]
name = "dispatcharr-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dispatcharr-job-transport = {path="../job-transport"}
axum = "0.8"
dispatcharr-realtime = {path="../realtime"}
dispatcharr-output-http = {path="../output-http"}
dispatcharr-hdhr-http = {path="../hdhr-http"}
dispatcharr-xc-http = {path="../xc-http"}
dispatcharr-xmltv-http = {path="../xmltv-http"}
dispatcharr-contracts = { path = "../contracts" }
dispatcharr-input-store = {path="../input-store"}
dispatcharr-output-store = { path = "../output-store" }
dispatcharr-vod-http = {path="../vod-http"}
dispatcharr-timeshift-http = {path="../timeshift-http"}
dispatcharr-fmp4-http = {path="../fmp4-http"}
dispatcharr-hls-http = { path = "../hls-http" }
dispatcharr-store = { path = "../store" }
dispatcharr-coordination = { path = "../coordination" }
dispatcharr-clients = { path = "../clients" }
dispatcharr-stream-http = { path = "../stream-http" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
