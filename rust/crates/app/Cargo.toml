[package]
name = "dispatcharr-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
dispatcharr-contracts = { path = "../contracts" }
dispatcharr-hls-http = { path = "../hls-http" }
dispatcharr-store = { path = "../store" }
dispatcharr-coordination = { path = "../coordination" }
dispatcharr-clients = { path = "../clients" }
dispatcharr-stream-http = { path = "../stream-http" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
