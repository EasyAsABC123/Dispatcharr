components:
  schemas:
    AccountTypeEnum:
      description: |-
        * `STD` - Standard
        * `XC` - Xtream Codes
      enum:
      - STD
      - XC
      type: string
    AppDataAppSummary:
      properties:
        bytes:
          description: Compact UTF-8 JSON size of that app's stored object
          type: integer
        key:
          description: 'App namespace (8 to 64 chars: [A-Za-z0-9][A-Za-z0-9._-]*)'
          type: string
      required:
      - bytes
      - key
      type: object
    AppDataDetailError:
      properties:
        code:
          description: Stable machine-readable identifier, for example key_invalid,
            key_not_found, value_too_large, total_too_large, max_apps, forbidden,
            user_not_found
          type: string
        detail:
          description: Human-readable error message
          type: string
      required:
      - code
      - detail
      type: object
    AppDataLimits:
      properties:
        key_max_length:
          type: integer
        key_min_length:
          type: integer
        max_apps:
          type: integer
        max_depth:
          type: integer
        max_total_bytes:
          type: integer
        max_value_bytes:
          type: integer
      required:
      - key_max_length
      - key_min_length
      - max_apps
      - max_depth
      - max_total_bytes
      - max_value_bytes
      type: object
    AppDataListResponse:
      description: GET .../app-data/ list payload (keys and sizes only, never values).
      properties:
        apps:
          items:
            $ref: '#/components/schemas/AppDataAppSummary'
          type: array
        limits:
          $ref: '#/components/schemas/AppDataLimits'
        total_bytes:
          type: integer
      required:
      - apps
      - limits
      - total_bytes
      type: object
    AssignChannelsRequest:
      properties:
        channel_ids:
          description: Channel IDs to assign
          items:
            type: integer
          type: array
        starting_number:
          description: Starting channel number to assign (can be decimal)
          format: double
          type: number
      required:
      - channel_ids
      type: object
    AvailablePluginsResponse:
      properties:
        plugins:
          items:
            additionalProperties: {}
            type: object
          type: array
      required:
      - plugins
      type: object
    BatchSetEpgRequest:
      properties:
        associations:
          items:
            $ref: '#/components/schemas/EpgAssociation'
          type: array
      required:
      - associations
      type: object
    BulkRegexRenameRequest:
      properties:
        channel_ids:
          items:
            type: integer
          type: array
        find:
          type: string
        flags:
          type: string
        replace:
          type: string
      required:
      - channel_ids
      - find
      type: object
    BulkRemoveSeriesRecordingsRequest:
      properties:
        epg_source_id:
          description: Optional EPG source. When set, only recordings tagged with
            that source (and untagged legacy snapshots) are removed.
          type: integer
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          default: title
          description: |-
            title: remove only matching title on channel, channel: remove all future recordings on channel

            * `title` - title
            * `channel` - channel
        title:
          description: Series title - when scope=title, only recordings matching this
            title are removed
          type: string
        tvg_id:
          description: Channel TVG ID (required)
          type: string
      required:
      - tvg_id
      type: object
    CatchupSessionCreate:
      properties:
        channel_uuid:
          description: Dispatcharr channel UUID to play catch-up from.
          format: uuid
          type: string
        duration:
          description: Optional programme length in minutes. Preferred over EPG when
            supplied. A short buffer is added for provider archive lag. Omit to derive
            the length from EPG.
          maximum: 480
          minimum: 1
          type: integer
        start:
          description: UTC programme start time (which archived show to play). ISO-8601
            (2026-07-09T14:00:00Z), Unix epoch, or XC wall-clock shapes.
          type: string
      required:
      - channel_uuid
      - start
      type: object
    CatchupSessionCreateError:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionDestroyForbidden:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionDestroyNotFound:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionForbidden:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionNotFound:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionPosition:
      properties:
        paused:
          description: When true, admin stats freeze at ``position_secs`` (no wall-clock
            advance). When false, clear pause. Omit to leave pause state unchanged.
          type: boolean
        position_secs:
          description: Current playhead within the programme, in seconds from programme
            start.
          format: double
          maximum: 28800
          minimum: 0
          type: number
      required:
      - position_secs
      type: object
    CatchupSessionPositionError:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionPositionForbidden:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionPositionNotFound:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    CatchupSessionResponse:
      properties:
        channel_uuid:
          format: uuid
          type: string
        duration:
          description: Programme length in minutes if supplied at creation, else null.
          nullable: true
          type: integer
        expires_at:
          description: 'Unix timestamp. Handshake deadline: first playback GET within
            this window.'
          type: integer
        playback_url:
          type: string
        session_id:
          type: string
        start:
          type: string
      required:
      - channel_uuid
      - expires_at
      - playback_url
      - session_id
      - start
      type: object
    CategoryTypeEnum:
      description: |-
        * `movie` - Movie
        * `series` - Series
      enum:
      - movie
      - series
      type: string
    ChanneProfilelMembershipUpdate:
      properties:
        channel_id:
          type: integer
        enabled:
          type: boolean
      required:
      - channel_id
      - enabled
      type: object
    Channel:
      properties:
        auto_created:
          description: Whether this channel was automatically created via M3U auto
            channel sync
          type: boolean
        auto_created_by:
          description: The M3U account that auto-created this channel
          nullable: true
          type: integer
        auto_created_by_name:
          readOnly: true
          type: string
        catchup_days:
          description: Max catch-up archive days across all streams on this channel
          maximum: 2147483647
          minimum: 0
          type: integer
        channel_group_id:
          type: integer
        channel_number:
          format: double
          nullable: true
          type: number
        effective_channel_group_id:
          readOnly: true
          type: string
        effective_channel_number:
          readOnly: true
          type: string
        effective_epg_data_id:
          readOnly: true
          type: string
        effective_is_radio:
          readOnly: true
          type: string
        effective_logo_id:
          readOnly: true
          type: string
        effective_name:
          readOnly: true
          type: string
        effective_stream_profile_id:
          readOnly: true
          type: string
        effective_tvc_guide_stationid:
          readOnly: true
          type: string
        effective_tvg_id:
          readOnly: true
          type: string
        epg_data_id:
          nullable: true
          type: integer
        hidden_from_output:
          description: Exclude this channel from downstream client output (HDHR, M3U,
            EPG, XC). Auto-sync still updates provider metadata.
          type: boolean
        id:
          readOnly: true
          type: integer
        is_adult:
          description: Whether this channel contains adult content
          type: boolean
        is_catchup:
          description: Whether any stream on this channel supports catch-up (tv_archive=1)
          type: boolean
        is_radio:
          description: Whether this channel is a radio channel, copied from its source
            stream
          type: boolean
        logo_id:
          nullable: true
          type: integer
        name:
          maxLength: 512
          type: string
        override:
          allOf:
          - $ref: '#/components/schemas/ChannelOverride'
          description: 'Per-field overrides for an auto-created channel. Send {"override":
            {"name": "ESPN"}} to upsert the listed fields, {"override": {"name": null}}
            to clear specific fields while leaving others, or {"override": null} to
            delete the override row entirely. Omitting the key leaves any existing
            override unchanged. Only valid for auto_created=True channels. Duplicate
            channel_number values across channels are permitted; downstream client
            behavior on duplicates varies by client.'
          nullable: true
        source_stream:
          readOnly: true
          type: string
        stream_profile_id:
          nullable: true
          type: integer
        streams:
          items:
            type: integer
          type: array
        tvc_guide_stationid:
          maxLength: 255
          nullable: true
          type: string
        tvg_id:
          maxLength: 255
          nullable: true
          type: string
        user_level:
          maximum: 2147483647
          minimum: -2147483648
          type: integer
        uuid:
          format: uuid
          readOnly: true
          type: string
      required:
      - auto_created_by_name
      - effective_channel_group_id
      - effective_channel_number
      - effective_epg_data_id
      - effective_is_radio
      - effective_logo_id
      - effective_name
      - effective_stream_profile_id
      - effective_tvc_guide_stationid
      - effective_tvg_id
      - id
      - name
      - source_stream
      - uuid
      type: object
    ChannelBulkEditErrorResponse:
      properties:
        errors:
          items:
            additionalProperties: {}
            type: object
          type: array
      required:
      - errors
      type: object
    ChannelBulkEditRequest:
      properties:
        channel_group_id:
          nullable: true
          type: integer
        channel_number:
          format: double
          type: number
        epg_data_id:
          nullable: true
          type: integer
        id:
          description: ID of the channel to update (required).
          type: integer
        is_adult:
          type: boolean
        logo_id:
          nullable: true
          type: integer
        name:
          type: string
        stream_profile_id:
          nullable: true
          type: integer
        streams:
          description: List of stream IDs to assign to this channel (replaces existing
            assignments).
          items:
            type: integer
          type: array
        tvc_guide_stationid:
          type: string
        tvg_id:
          type: string
        user_level:
          type: integer
      required:
      - id
      type: object
    ChannelBulkEditResponse:
      properties:
        channels:
          items:
            $ref: '#/components/schemas/Channel'
          type: array
        message:
          type: string
      required:
      - channels
      - message
      type: object
    ChannelByUUIDsRequest:
      properties:
        uuids:
          description: List of channel UUIDs to retrieve
          items:
            type: string
          type: array
      required:
      - uuids
      type: object
    ChannelGroup:
      properties:
        channel_count:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        is_custom:
          readOnly: true
          type: string
        m3u_account_count:
          readOnly: true
          type: string
        m3u_accounts:
          items:
            $ref: '#/components/schemas/ChannelGroupM3UAccount'
          readOnly: true
          type: array
        name:
          type: string
      required:
      - channel_count
      - id
      - is_custom
      - m3u_account_count
      - m3u_accounts
      - name
      type: object
    ChannelGroupM3UAccount:
      properties:
        auto_channel_sync:
          default: false
          type: boolean
        auto_sync_channel_end:
          format: double
          minimum: 1
          nullable: true
          type: number
        auto_sync_channel_start:
          format: double
          minimum: 1
          nullable: true
          type: number
        channel_group:
          type: integer
        custom_properties: {}
        enabled:
          type: boolean
        is_stale:
          description: Whether this group relationship is stale (not seen in recent
            refresh, pending deletion)
          type: boolean
        last_seen:
          description: Last time this group was seen in the M3U source during a refresh
          format: date-time
          type: string
        m3u_accounts:
          readOnly: true
          type: integer
        stream_count:
          readOnly: true
          type: string
      required:
      - channel_group
      - enabled
      - m3u_accounts
      - stream_count
      type: object
    ChannelOverride:
      properties:
        channel_group_id:
          nullable: true
          type: integer
        channel_number:
          format: double
          minimum: 0.0001
          nullable: true
          type: number
        epg_data_id:
          nullable: true
          type: integer
        is_radio:
          description: User override for is_radio; null follows the channel value
          nullable: true
          type: boolean
        logo_id:
          nullable: true
          type: integer
        name:
          maxLength: 512
          nullable: true
          type: string
        stream_profile_id:
          nullable: true
          type: integer
        tvc_guide_stationid:
          maxLength: 255
          nullable: true
          type: string
        tvg_id:
          maxLength: 255
          nullable: true
          type: string
      type: object
    ChannelProfile:
      properties:
        channels:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 100
          type: string
        start_empty:
          default: false
          type: boolean
          writeOnly: true
      required:
      - channels
      - id
      - name
      type: object
    ChannelStreamStatsDelta:
      properties:
        id:
          type: integer
        stream_stats:
          nullable: true
        stream_stats_updated_at:
          format: date-time
          nullable: true
          type: string
      required:
      - id
      - stream_stats
      - stream_stats_updated_at
      type: object
    ChannelStreamStatsErrorResponse:
      properties:
        detail:
          type: string
      required:
      - detail
      type: object
    ChannelsInRangeResponse:
      properties:
        occupants:
          items:
            additionalProperties: {}
            type: object
          type: array
      required:
      - occupants
      type: object
    CleanupUnusedLogosRequest:
      properties:
        delete_files:
          default: false
          description: Whether to delete local logo files from disk
          type: boolean
      type: object
    ContentTypeEnum:
      description: |-
        * `movie` - movie
        * `series` - series
      enum:
      - movie
      - series
      type: string
    CoreSettings:
      properties:
        id:
          readOnly: true
          type: integer
        key:
          maxLength: 255
          type: string
        name:
          maxLength: 255
          type: string
        value: {}
      required:
      - id
      - key
      - name
      type: object
    CurrentProgramsRequest:
      properties:
        channel_uuids:
          description: Array of channel UUIDs. If null or omitted, returns all channels
            with current programs.
          items:
            type: string
          nullable: true
          type: array
        epg_data_ids:
          description: Array of EPG data IDs. Can be used instead of channel_ids.
          items:
            type: integer
          nullable: true
          type: array
      type: object
    DeliveryLog:
      properties:
        created_at:
          format: date-time
          readOnly: true
          type: string
        error_message:
          nullable: true
          type: string
        id:
          readOnly: true
          type: integer
        request_payload: {}
        response_payload: {}
        status:
          $ref: '#/components/schemas/DeliveryLogStatusEnum'
        subscription:
          allOf:
          - $ref: '#/components/schemas/EventSubscription'
          readOnly: true
      required:
      - created_at
      - id
      - status
      - subscription
      type: object
    DeliveryLogStatusEnum:
      description: |-
        * `success` - Success
        * `failed` - Failed
      enum:
      - success
      - failed
      type: string
    DescriptionModeEnum:
      description: |-
        * `contains` - contains
        * `search` - search
        * `regex` - regex
      enum:
      - contains
      - search
      - regex
      type: string
    EPGData:
      description: |-
        Only returns the tvg_id and the 'name' field from EPGData.
        We assume 'name' is effectively the channel name.
      properties:
        epg_source:
          nullable: true
          type: integer
        icon_url:
          nullable: true
          oneOf:
          - format: uri
            maxLength: 500
            type: string
          - maxLength: 0
            type: string
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 512
          type: string
        tvg_id:
          maxLength: 255
          nullable: true
          type: string
      required:
      - id
      - name
      type: object
    EPGGridProgram:
      description: |-
        One programme object in ``GET /api/epg/grid/``.

        Matches the streamed JSON fields. ``custom_properties`` is present on
        dummy programmes only (null when empty) and omitted for stored rows.
      properties:
        custom_properties:
          description: Present on dummy programmes only. Null when empty.
          nullable: true
        description:
          nullable: true
          type: string
        end_time:
          format: date-time
          type: string
        episode:
          nullable: true
          type: integer
        id:
          description: Stored programme primary key, or a synthetic dummy id (prefix-channelId-YYYYMMDDTHHMMSS).
          type: string
        is_finale:
          type: boolean
        is_live:
          type: boolean
        is_new:
          type: boolean
        is_premiere:
          type: boolean
        season:
          nullable: true
          type: integer
        start_time:
          format: date-time
          type: string
        sub_title:
          nullable: true
          type: string
        title:
          nullable: true
          type: string
        tvg_id:
          nullable: true
          type: string
      required:
      - end_time
      - id
      - is_finale
      - is_live
      - is_new
      - is_premiere
      - start_time
      type: object
    EPGGridResponse:
      description: Envelope for ``GET /api/epg/grid/``.
      properties:
        data:
          items:
            $ref: '#/components/schemas/EPGGridProgram'
          type: array
      required:
      - data
      type: object
    EPGImportRequest:
      properties:
        id:
          description: ID of the EPG source to refresh.
          type: integer
      required:
      - id
      type: object
    EPGSource:
      properties:
        created_at:
          description: Time when this source was created
          format: date-time
          readOnly: true
          type: string
        cron_expression:
          default: ''
          type: string
        custom_properties:
          description: Custom properties for source-specific configuration
          nullable: true
        epg_data_count:
          readOnly: true
          type: string
        file_path:
          maxLength: 1024
          nullable: true
          type: string
        has_channels:
          default: false
          readOnly: true
          type: boolean
        id:
          readOnly: true
          type: integer
        is_active:
          type: boolean
        last_message:
          description: Last status message, including success results or error information
          nullable: true
          type: string
        name:
          maxLength: 255
          type: string
        password:
          description: Password for credential-based EPG sources (e.g. Schedules Direct)
          maxLength: 255
          nullable: true
          type: string
          writeOnly: true
        priority:
          description: Priority for EPG matching (higher numbers = higher priority).
            Used when multiple EPG sources have matching entries for a channel.
          maximum: 2147483647
          minimum: 0
          type: integer
        refresh_interval:
          maximum: 2147483647
          minimum: -2147483648
          type: integer
        source_type:
          $ref: '#/components/schemas/SourceTypeEnum'
        status:
          $ref: '#/components/schemas/EPGSourceStatusEnum'
        updated_at:
          description: Time when this source was last successfully refreshed
          format: date-time
          nullable: true
          type: string
        url:
          nullable: true
          type: string
        username:
          description: Username for credential-based EPG sources (e.g. Schedules Direct)
          maxLength: 255
          nullable: true
          type: string
      required:
      - created_at
      - epg_data_count
      - has_channels
      - id
      - name
      - source_type
      type: object
    EPGSourceStatusEnum:
      description: |-
        * `idle` - Idle
        * `fetching` - Fetching
        * `parsing` - Parsing
        * `error` - Error
        * `success` - Success
        * `disabled` - Disabled
      enum:
      - idle
      - fetching
      - parsing
      - error
      - success
      - disabled
      type: string
    EpgAssociation:
      properties:
        channel_id:
          type: integer
        epg_data_id:
          description: EPG data ID to link. Pass null to remove EPG linkage.
          nullable: true
          type: integer
      required:
      - channel_id
      type: object
    Episode:
      properties:
        air_date:
          format: date
          nullable: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        custom_properties:
          nullable: true
        description:
          nullable: true
          type: string
        duration_secs:
          description: Duration in seconds
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        episode_number:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        id:
          readOnly: true
          type: integer
        imdb_id:
          description: IMDB ID for metadata
          maxLength: 50
          nullable: true
          type: string
        name:
          maxLength: 255
          type: string
        rating:
          maxLength: 10
          nullable: true
          type: string
        season_number:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        series:
          allOf:
          - $ref: '#/components/schemas/Series'
          readOnly: true
        tmdb_id:
          description: TMDB ID for metadata
          maxLength: 50
          nullable: true
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
        uuid:
          format: uuid
          readOnly: true
          type: string
      required:
      - created_at
      - id
      - name
      - series
      - updated_at
      - uuid
      type: object
    EpisodeWithProviders:
      description: Episode payload with nested provider relations (series episodes
        action).
      properties:
        air_date:
          format: date
          nullable: true
          type: string
        created_at:
          format: date-time
          readOnly: true
          type: string
        custom_properties:
          nullable: true
        description:
          nullable: true
          type: string
        duration_secs:
          description: Duration in seconds
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        episode_number:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        id:
          readOnly: true
          type: integer
        imdb_id:
          description: IMDB ID for metadata
          maxLength: 50
          nullable: true
          type: string
        name:
          maxLength: 255
          type: string
        providers:
          items:
            $ref: '#/components/schemas/M3UEpisodeRelation'
          readOnly: true
          type: array
        rating:
          maxLength: 10
          nullable: true
          type: string
        season_number:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        series:
          allOf:
          - $ref: '#/components/schemas/Series'
          readOnly: true
        tmdb_id:
          description: TMDB ID for metadata
          maxLength: 50
          nullable: true
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
        uuid:
          format: uuid
          readOnly: true
          type: string
      required:
      - created_at
      - id
      - name
      - providers
      - series
      - updated_at
      - uuid
      type: object
    EvaluateSeriesRulesRequest:
      properties:
        tvg_id:
          description: 'Optional: evaluate only rules for this channel TVG ID. If
            omitted, all rules are evaluated.'
          type: string
      type: object
    EventEnum:
      description: |-
        * `channel_start` - Channel Started
