      description: Logo shape returned by the unified content SQL list endpoint.
      properties:
        cache_url:
          type: string
        id:
          type: integer
        is_used:
          type: boolean
        movie_count:
          type: integer
        name:
          nullable: true
          type: string
        series_count:
          type: integer
        url:
          nullable: true
          type: string
      required:
      - cache_url
      - id
      - is_used
      - movie_count
      - name
      - series_count
      - url
      type: object
    User:
      properties:
        api_key:
          nullable: true
          readOnly: true
          type: string
        avatar_config:
          nullable: true
        channel_profiles:
          items:
            type: integer
          type: array
        custom_properties:
          nullable: true
        date_joined:
          format: date-time
          type: string
        email:
          oneOf:
          - format: email
            maxLength: 254
            type: string
          - maxLength: 0
            type: string
          title: Email address
        first_name:
          maxLength: 150
          type: string
        id:
          readOnly: true
          type: integer
        is_staff:
          description: Designates whether the user can log into this admin site.
          title: Staff status
          type: boolean
        is_superuser:
          description: Designates that this user has all permissions without explicitly
            assigning them.
          title: Superuser status
          type: boolean
        last_login:
          format: date-time
          nullable: true
          type: string
        last_name:
          maxLength: 150
          type: string
        password:
          type: string
          writeOnly: true
        stream_limit:
          maximum: 2147483647
          minimum: -2147483648
          type: integer
        user_level:
          maximum: 2147483647
          minimum: -2147483648
          type: integer
        username:
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          maxLength: 150
          pattern: ^[\w.@+-]+$
          type: string
      required:
      - api_key
      - id
      - username
      type: object
    UserAgent:
      properties:
        created_at:
          format: date-time
          readOnly: true
          type: string
        description:
          description: An optional description of the client or device type.
          maxLength: 255
          type: string
        id:
          readOnly: true
          type: integer
        is_active:
          description: Whether this user agent is currently allowed/recognized.
          type: boolean
        name:
          description: The User-Agent name.
          maxLength: 512
          type: string
        updated_at:
          format: date-time
          readOnly: true
          type: string
        user_agent:
          description: The complete User-Agent string sent by the client.
          maxLength: 512
          type: string
      required:
      - created_at
      - id
      - name
      - updated_at
      - user_agent
      type: object
    VODCategory:
      properties:
        category_type:
          allOf:
          - $ref: '#/components/schemas/CategoryTypeEnum'
          default: movie
          description: |-
            Type of content this category contains

            * `movie` - Movie
            * `series` - Series
        category_type_display:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        m3u_accounts:
          items:
            $ref: '#/components/schemas/M3UVODCategoryRelation'
          readOnly: true
          type: array
        name:
          maxLength: 255
          type: string
      required:
      - category_type_display
      - id
      - m3u_accounts
      - name
      type: object
    VODLogo:
      properties:
        cache_url:
          format: uri
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        is_used:
          description: Whether this logo is used by any movie or series
          readOnly: true
          type: boolean
        item_names:
          description: List of movies and series using this logo (limited to 10)
          items:
            type: string
          readOnly: true
          type: array
        movie_count:
          description: Number of movies using this logo
          readOnly: true
          type: integer
        name:
          type: string
        series_count:
          description: Number of series using this logo
          readOnly: true
          type: integer
        url:
          type: string
      required:
      - cache_url
      - id
      - is_used
      - item_names
      - movie_count
      - name
      - series_count
      - url
      type: object
    VODLogoBulkDeleteResponse:
      properties:
        deleted_count:
          type: integer
        message:
          type: string
      required:
      - deleted_count
      - message
      type: object
    VODLogoCleanupResponse:
      properties:
        deleted_count:
          type: integer
        deleted_logos:
          items:
            type: string
          type: array
        message:
          type: string
      required:
      - deleted_count
      - deleted_logos
      - message
      type: object
    VODProviderAccount:
      description: Slim M3U account payload embedded in provider-info responses.
      properties:
        account_type:
          type: string
        id:
          type: integer
        name:
          type: string
      required:
      - account_type
      - id
      - name
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: |-
        API key authentication.

        Pass your personal API key in the `X-API-Key` request header. Keys can be generated via `POST /api/accounts/api-keys/generate/` and revoked via `POST /api/accounts/api-keys/revoke/`.
      in: header
      name: X-API-Key
      type: apiKey
    jwtAuth:
      bearerFormat: JWT
      description: |-
        JWT Bearer authentication.

        Obtain a token pair via `POST /api/accounts/token/` using your username and password, then paste the **access token** here — Swagger adds the `Bearer ` prefix automatically.

        Access tokens expire after 30 minutes. Refresh using `POST /api/accounts/token/refresh/`.
      scheme: bearer
      type: http
info:
  description: API documentation for Dispatcharr
  title: Dispatcharr API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/accounts/api-keys/:
    get:
      operationId: api_accounts_api_keys_retrieve
      responses:
        '200':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/api-keys/generate/:
    post:
      operationId: api_accounts_api_keys_generate_create
      responses:
        '200':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/api-keys/revoke/:
    post:
      operationId: api_accounts_api_keys_revoke_create
      responses:
        '200':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/auth/login/:
    post:
      description: Alias for POST /api/accounts/token/ — returns JWT access and refresh
        tokens.
      operationId: api_accounts_auth_login_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/auth/logout/:
    post:
      description: Log out the current user
      operationId: api_accounts_auth_logout_create
      responses:
        '200':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/auth/proxy-login/:
    post:
      description: Exchange a reverse-proxy-asserted identity for JWT tokens. Returns
        401 unless reverse proxy auth is enabled, the request carries the configured
        header, and the connecting peer is a trusted proxy. Takes no request body.
      operationId: api_accounts_auth_proxy_login_create
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyLoginResponse'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/groups/:
    get:
      description: Retrieve a list of groups
      operationId: api_accounts_groups_list
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Group'
                type: array
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    post:
      description: Create a new group
      operationId: api_accounts_groups_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/groups/{id}/:
    delete:
      description: Delete a group
      operationId: api_accounts_groups_destroy
      parameters:
      - description: A unique integer value identifying this group.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    get:
      description: Retrieve a specific group by ID
      operationId: api_accounts_groups_retrieve
      parameters:
      - description: A unique integer value identifying this group.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    patch:
      description: |-
        CRUD for Django auth groups and their permissions.

        Dispatcharr authorization uses ``user_level``, not these groups. The
        endpoint is kept for compatibility but restricted to admins so
        non-admins cannot invent auth groups or attach Django permissions.
      operationId: api_accounts_groups_partial_update
      parameters:
      - description: A unique integer value identifying this group.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    put:
      description: Update a group
      operationId: api_accounts_groups_update
      parameters:
      - description: A unique integer value identifying this group.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/permissions/:
    get:
      description: Retrieve a list of all permissions
      operationId: api_accounts_permissions_list
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Permission'
                type: array
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/token/:
    post:
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      operationId: api_accounts_token_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
      tags:
      - api
  /api/accounts/token/refresh/:
    post:
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      operationId: api_accounts_token_refresh_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
      tags:
      - api
  /api/accounts/users/:
    get:
      description: Retrieve a list of users
      operationId: api_accounts_users_list
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    post:
      description: Create a new user
      operationId: api_accounts_users_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/users/me/:
    get:
      description: Get or update active user information. PATCH updates custom_properties
        with merge semantics.
      operationId: api_accounts_users_me_retrieve
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    patch:
      description: Get or update active user information. PATCH updates custom_properties
        with merge semantics.
      operationId: api_accounts_users_me_partial_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
  /api/accounts/users/me/app-data/:
    delete:
      description: Delete every app namespace stored for the user. Idempotent when
        nothing is stored. Owner or admin only.
      operationId: api_accounts_users_me_app_data_destroy
      responses:
        '204':
          content:
            application/json:
              schema: null
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      summary: Clear all app data
      tags:
      - api
    get:
      description: |-
        Return the app namespaces stored for the user with per-key byte sizes and the current limits. Values are never included.

        Use `/api/accounts/users/me/app-data/` for the authenticated user (including streamers), or `/api/accounts/users/{user_id}/app-data/` as an admin for another user (owners may also use their own id).

        Caps: 128 KiB per app, 1 MiB and 25 apps per user, nesting depth 8.
      operationId: api_accounts_users_me_app_data_retrieve
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      summary: List app data keys
      tags:
      - api
  /api/accounts/users/me/app-data/{key}/:
    delete:
      description: 'Delete the JSON object stored under the given app key. Idempotent:
        a missing key still returns 204 (not 404). 404 with `code=user_not_found`
        is only for an unknown `user_id` on the admin path. Owner or admin only.'
      operationId: api_accounts_users_me_app_data_destroy_2
      parameters:
      - description: 'App namespace: 8 to 64 characters matching [A-Za-z0-9][A-Za-z0-9._-]*
          (must start with a letter or digit). A typical reverse-DNS style key is
          fine, for example com.example.tvremote. Keys are namespaces, not secrets.'
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '204':
          content:
            application/json:
              schema: null
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      summary: Clear one app's stored JSON object
      tags:
      - api
    get:
      description: Return the JSON object stored under the given app key. Owner or
        admin only. Missing keys return 404 with `code=key_not_found`.
      operationId: api_accounts_users_me_app_data_retrieve_2
      parameters:
      - description: 'App namespace: 8 to 64 characters matching [A-Za-z0-9][A-Za-z0-9._-]*
          (must start with a letter or digit). A typical reverse-DNS style key is
          fine, for example com.example.tvremote. Keys are namespaces, not secrets.'
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      summary: Get one app's stored JSON object
      tags:
      - api
    put:
      description: |-
        Replace the JSON object stored under the given app key. Request body must be a JSON object (not an array or scalar). Caps: 128 KiB per app, 1 MiB and 25 apps per user, nesting depth 8. Owner or admin only.

        Error `code` values include `value_too_large` (413), `total_too_large` (413), `max_apps` (409), `key_invalid` (400), and `value_not_object` (400).
      operationId: api_accounts_users_me_app_data_update
      parameters:
      - description: 'App namespace: 8 to 64 characters matching [A-Za-z0-9][A-Za-z0-9._-]*
          (must start with a letter or digit). A typical reverse-DNS style key is
          fine, for example com.example.tvremote. Keys are namespaces, not secrets.'
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDataDetailError'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      summary: Replace one app's stored JSON object
      tags:
      - api
  /api/accounts/users/{id}/:
    delete:
      description: Delete a user
      operationId: api_accounts_users_destroy
      parameters:
      - description: A unique integer value identifying this user.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    get:
      description: Retrieve a specific user by ID
      operationId: api_accounts_users_retrieve
      parameters:
      - description: A unique integer value identifying this user.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    patch:
      description: Handles CRUD operations for Users
      operationId: api_accounts_users_partial_update
      parameters:
      - description: A unique integer value identifying this user.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
    put:
      description: Update a user
      operationId: api_accounts_users_update
      parameters:
      - description: A unique integer value identifying this user.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
