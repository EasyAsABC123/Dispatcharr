  /api/epg/grid/:
    get:
      description: 'Retrieve programs overlapping a time window for channels the caller
        can see. With no query parameters the window is the previous hour through
        the next 24 hours (recently ended, currently airing, and upcoming). Use ``days``/``prev_days``
        for relative day offsets from now, or ``start``/``end`` (ISO 8601) for an
        explicit range. Optional ``channel_profile_id`` limits output to that profile.
        Omitted or ``all``: for users with assigned profiles, the union of those profiles;
        otherwise every non-hidden channel the caller may access by user level. EPG
        assignments honor channel overrides.'
      operationId: api_epg_grid_retrieve
      parameters:
      - description: 'Limit programmes to channels enabled in this profile. Omitted
          or ``all``: union of the caller''s assigned profiles when they have any;
          otherwise every non-hidden channel allowed by user level.'
        in: query
        name: channel_profile_id
        schema:
          type: integer
      - description: 'Number of days forward from now (1-365). Omitted: 24 hours forward.
          0 is treated as 1. Ignored when start or end is set.'
        in: query
        name: days
        schema:
          type: integer
      - description: 'Window end as ISO 8601 datetime. Takes precedence over days/prev_days.
          Omitted with start present: defaults to start plus 24 hours.'
        in: query
        name: end
        schema:
          format: date-time
          type: string
      - description: 'Number of days of lookback from now (0-30). Omitted: 1 hour
          (recently ended plus currently on). 0 means start at now. Ignored when start
          or end is set.'
        in: query
        name: prev_days
        schema:
          type: integer
      - description: 'Window start as ISO 8601 datetime. Takes precedence over days/prev_days.
          Omitted with end present: defaults to now minus 1 hour.'
        in: query
        name: start
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EPGGridResponse'
          description: ''
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      tags:
      - api
