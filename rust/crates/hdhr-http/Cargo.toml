[package]
name = "dispatcharr-hdhr-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
bytes = "1"
dispatcharr-contracts = {path="../contracts"}
dispatcharr-store = {path="../store"}
futures-util = "0.3"
serde_json = "1"
sqlx = {version="0.8",features=["runtime-tokio-rustls","postgres","json"]}
tokio = {version="1",features=["rt-multi-thread","net","sync","time","macros"]}
url = "2"

[dev-dependencies]
http-body-util = "0.1"
reqwest = {version="0.12",default-features=false,features=["json","stream"]}
