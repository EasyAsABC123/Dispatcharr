[package]
name="dispatcharr-ingest-core"
version.workspace=true
edition.workspace=true
license.workspace=true
[dependencies]
regex="1"
serde={version="1",features=["derive"]}
sha2="0.10"
serde_json="1"
flate2={version="1.1.11",default-features=false,features=["zlib-rs"]}
xz2={version="=0.1.7",features=["static"]}
zip={version="=9.5.0",default-features=false,features=["deflate-flate2-zlib-rs","bzip2","lzma"]}
[dev-dependencies]
fancy-regex={version="=0.20.0",default-features=false,features=["std","unicode","perf"]}
