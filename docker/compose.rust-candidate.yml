# Overlay on compose.rust-playback.yml. The baseline container supplies the
# migrated fixture database and Redis. Stop its web worker for candidate trials.
services:
  baseline:
    volumes:
      - ../scripts/rust-integration:/integration:ro
  candidate:
    image: dispatcharr-rust-candidate:milestone2
    build:
      context: ..
      dockerfile: rust/Dockerfile.app
    environment:
      DATABASE_URL: postgresql://dispatch:playback-fixture-only@baseline:5432/dispatcharr
      DJANGO_SECRET_KEY: playback-fixture-only
      REDIS_URL: redis://:playback-fixture-only@baseline:6379/0
      RUST_BIND: 0.0.0.0:9192
      RUST_DATABASE_POOL_SIZE: "8"
      RUST_MAX_CHANNELS: "32"
      RUST_MAX_VIEWERS_PER_CHANNEL: "400"
      RUST_RETAINED_BYTES_PER_CHANNEL: "16777216"
      RUST_RETENTION_SECONDS: "60"
      TOKIO_WORKER_THREADS: "1"
      DISPATCHARR_TRUSTED_PROXIES: none
    ports: ["127.0.0.1::9192"]
    depends_on: [baseline]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
