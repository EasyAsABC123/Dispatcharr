# Isolated verification overlay only. Original Dispatcharr author credit retained.
# Layer after compose.rust-playback.yml and compose.rust-candidate.yml.
services:
  candidate-replica:
    extends:
      file: compose.rust-candidate.yml
      service: candidate
  python-replica:
    image: ghcr.io/dispatcharr/dispatcharr@sha256:34f9011514edd31ef0ff111b5f256d2e37614fcb08a6ee1ed9eccec9251a856f
    platform: linux/amd64
    working_dir: /app
    entrypoint: [/dispatcharrpy/bin/uwsgi]
    command: [--ini, /verification/uwsgi.ini]
    environment:
      DISPATCHARR_ENV: aio
      DJANGO_SECRET_KEY: playback-fixture-only
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: playback-fixture-only
      POSTGRES_HOST: baseline
      POSTGRES_PORT: "5432"
      REDIS_HOST: baseline
      REDIS_PORT: "6379"
      REDIS_PASSWORD: playback-fixture-only
      DISPATCHARR_LOG_LEVEL: WARNING
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ${BASELINE_SOURCE_DIR:?Run scripts/rust-integration/shared_ts.py}:/app:ro
      - ../scripts/rust-playback-baseline:/verification:ro
      - ${BASELINE_EVIDENCE_DIR:?Run scripts/rust-integration/shared_ts.py}:/evidence
    ports: ["127.0.0.1::5656"]
    tmpfs:
      - /data:mode=1777,size=67108864
      - /app/media:mode=1777,size=67108864
      - /tmp:mode=1777,size=67108864
    depends_on: [baseline]
    stop_grace_period: 15s
