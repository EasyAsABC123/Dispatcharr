# Existing Python backend tests, not a Rust replacement or performance workload.
services:
  baseline-tests:
    image: ghcr.io/dispatcharr/dispatcharr@sha256:34f9011514edd31ef0ff111b5f256d2e37614fcb08a6ee1ed9eccec9251a856f
    platform: linux/amd64
    working_dir: /app
    entrypoint: ["bash", "/verification/container.sh"]
    command:
      - apps.proxy.live_proxy.tests.test_ts_discontinuity
      - apps.proxy.live_proxy.tests.test_buffer_discontinuity
      - apps.proxy.live_proxy.tests.test_hls_segmenter
    environment:
      DISPATCHARR_ENV: aio
      GITHUB_WORKSPACE: /app
      DJANGO_SECRET_KEY: isolated-baseline-tests-only
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: isolated-baseline-tests-only
      POSTGRES_DIR: /data/db
      POSTGRES_PORT: "5432"
      DISPATCHARR_LOG_LEVEL: WARNING
      SYNC_PYTHON_DEPS: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    network_mode: none
    volumes:
      - ${BASELINE_SOURCE_DIR:?Run scripts/rust-baseline/run.py}:/app:ro
      - ../scripts/rust-baseline:/verification:ro
      - ${BASELINE_EVIDENCE_DIR:?Run scripts/rust-baseline/run.py}:/evidence
    tmpfs:
      - /data:mode=1777,size=2147483648
      - /app/media:mode=1777,size=67108864
      - /tmp:mode=1777,size=2147483648
