name: Native ARM64 local CLI, Compose, and copied data
"on":
  push:
    branches: [validation/m10-arm64-local-compose-3efd9a20-1]
    paths:
      - '.github/workflows/native-arm64-local-cli.yml'
      - 'scripts/rust-platform-contracts/native-arm64-combined-assembly/**'
permissions:
  contents: read
concurrency:
  group: m10-arm64-local-compose-3efd9a20-1
  cancel-in-progress: false
jobs:
  local-cli:
    if: github.repository == 'EasyAsABC123/Dispatcharr' && github.ref == 'refs/heads/validation/m10-arm64-local-compose-3efd9a20-1' && !github.event.deleted
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/native-arm64-local-cli.yml
            /scripts/rust-platform-contracts/native-arm64-combined-assembly/
      - name: Invoke checked-in CLI and qualify its exact retained image through Compose
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "3efd9a2005d87adf556869c160057920ee3f94e4"
          test "$(uname -m)" = aarch64
          python3 -B scripts/rust-platform-contracts/native-arm64-combined-assembly/test_local.py
          work=$(mktemp -d "$RUNNER_TEMP/dispatcharr-arm64-local-cli.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          python3 -B scripts/rust-platform-contracts/native-arm64-combined-assembly/verify_local_and_compose.py \
            --work "$work" --owner "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --evidence "$RUNNER_TEMP/native-arm64-local-cli-evidence"
      - name: Retain redacted local CLI test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-arm64-local-cli-evidence
          path: ${{ runner.temp }}/native-arm64-local-cli-evidence/
          if-no-files-found: error
          retention-days: 14
