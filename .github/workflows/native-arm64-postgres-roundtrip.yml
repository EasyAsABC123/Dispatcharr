name: Native ARM64 PostgreSQL client database roundtrip

"on":
  push:
    branches: [validation/m10-arm64-postgres-roundtrip-0ad0b34f-2]
    paths:
      - '.github/workflows/native-arm64-postgres-roundtrip.yml'
      - 'scripts/rust-platform-contracts/native-arm64-postgres-roundtrip/**'

permissions:
  contents: read

concurrency:
  group: m10-arm64-postgres-roundtrip-0ad0b34f
  cancel-in-progress: false

jobs:
  postgres:
    if: github.repository == 'EasyAsABC123/Dispatcharr' && github.ref == 'refs/heads/validation/m10-arm64-postgres-roundtrip-0ad0b34f-2' && !github.event.deleted
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out exact validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/native-arm64-postgres-roundtrip.yml
            /scripts/rust-platform-contracts/native-arm64-postgres-roundtrip/
            /scripts/rust-platform-contracts/native-arm64-postgres-debian/
            /ATTRIBUTION.md
      - name: Run a generated database through the exact ARM64 Debian PostgreSQL clients
        shell: bash
        run: bash scripts/rust-platform-contracts/native-arm64-postgres-roundtrip/qualify.sh
      - name: Retain text evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-arm64-postgres-roundtrip-evidence
          path: ${{ runner.temp }}/native-arm64-postgres-roundtrip-evidence/
          if-no-files-found: error
          retention-days: 14
